# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - pdf
  - epub

# Only the documentation tools are installed: the package dependencies (PyTorch, ...)
# are mocked in docs/conf.py for the API reference.
python:
  install:
    - requirements: docs/requirements.txt
