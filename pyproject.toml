[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ribonet"
dynamic = ["version"]
description = "Deep learning analysis toolkit for ribosome profiling"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Xavier Hernandez-Alias", email = "xa.he.al@gmail.com"},
]
maintainers = [
    {name = "Xavier Hernandez-Alias", email = "xa.he.al@gmail.com"},
    {name = "Danny Nedialkova", email = "nedialkova@biochem.mpg.de"},
    {name = "Julien Gagneur", email = "gagneur@in.tum.de"},
]
keywords = [
    "ribosome profiling",
    "deep learning",
    "bioinformatics",
    "translation",
    "regulatory motifs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.9",
    "numba>=0.56",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "pillow",
    "torch>=2.0",
    "transformers>=4.30,<5",
    "tqdm",
    "pyarrow>=10",
    "h5py",
    "hdf5plugin",
    "openpyxl",
    "logomaker",
    "biopython",
    "pysam>=0.21",
    "gffutils>=0.12",
    "igraph",
    "leidenalg",
    "reportlab>=4.0",
    "beautifulsoup4",
]

[project.optional-dependencies]
# RiNALMo language model embeddings (--lm rinalmo)
rinalmo = ["multimolecule"]
# Optional experiment tracking during model evaluation
wandb = ["wandb"]
test = ["pytest"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2"]

[project.urls]
Homepage = "https://github.com/nedialkova-lab/RiboNet"
Documentation = "https://ribonet.readthedocs.io"
Repository = "https://github.com/nedialkova-lab/RiboNet"
"Bug Tracker" = "https://github.com/nedialkova-lab/RiboNet/issues"

[project.scripts]
ribonet = "ribonet.ribonet:main"

[tool.setuptools.packages.find]
include = ["ribonet*"]

[tool.setuptools.package-data]
ribonet = ["data/**/*"]

[tool.setuptools.dynamic]
version = {attr = "ribonet.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
